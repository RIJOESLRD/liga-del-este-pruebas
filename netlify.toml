# Configuración de Netlify para la web de la Liga del Este (sitio estático, sin compilación).
[build]
  publish = "."

# Los datos de Dribbli cambian cada semana: que el navegador siempre pregunte si hay versión nueva.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
